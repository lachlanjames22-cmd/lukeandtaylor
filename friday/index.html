<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0714">
<title>Friday morning</title>
<link rel="icon" href="/img/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=Monoton&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:#0b0714;color:#fff;-webkit-font-smoothing:antialiased}
.screen{min-height:100vh;min-height:100dvh;padding:48px 16px;display:flex;align-items:center;justify-content:center}
.night{background:radial-gradient(circle at 50% 30%,#2a0f4a 0%,#0b0714 70%)}
.box{text-align:center;max-width:420px}
.neon{font-family:Monoton,cursive;font-size:clamp(34px,11vw,56px);line-height:1.15;color:#ff4fd8;text-shadow:0 0 6px #ff4fd8,0 0 18px #ff4fd8,0 0 40px #b400ff;letter-spacing:2px;animation:flick 4s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.4}}
.night p{margin-top:18px;color:#d9c8ff;font-size:16px;line-height:1.5}
.count{margin-top:26px;display:flex;gap:10px;justify-content:center}
.count div{background:#ffffff10;border:1px solid #ff4fd855;border-radius:12px;padding:10px 0;width:64px}
.count b{display:block;font-size:24px;color:#7ff6ff;text-shadow:0 0 10px #00e5ff;font-variant-numeric:tabular-nums}
.count small{font-size:10px;letter-spacing:1px;opacity:.7;text-transform:uppercase}
.foot{margin-top:28px;font-size:12px;opacity:.5}
.morning{background:linear-gradient(180deg,#ffd9b8 0%,#ffeedd 35%,#e8f4f7 70%,#cfe8ee 100%);color:#2a2230}
.card{max-width:560px;width:100%;background:#fffaf4ee;border-radius:22px;padding:34px 24px;box-shadow:0 20px 60px rgba(120,70,40,.18);animation:rise 1.4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sun{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle,#ffcf6e,#ff9a5a);box-shadow:0 0 40px #ffb36b}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(26px,7vw,34px);text-align:center;line-height:1.2}
h1 span{display:block;font-style:italic;font-size:.62em;color:#b05a8a;margin-top:6px}
.note{margin-top:24px;font-size:17px;line-height:1.7}
.note p{margin-bottom:14px}
.sig{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const SLUG="friday",LABEL="Friday morning",FALLBACK=1795730400000;
const app=document.getElementById('app');let timer;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function locked(unlock){
  clearInterval(timer);
  app.innerHTML=`<div class="screen night"><div class="box"><div class="neon">Not yet,<br>Taylor</div>
  <p>This one opens ${LABEL}.<br>Go have fun. I'll be here when the sun's up.</p>
  <div class="count"><div><b id="d">0</b><small>days</small></div><div><b id="h">00</b><small>hrs</small></div><div><b id="m">00</b><small>min</small></div><div><b id="s">00</b><small>sec</small></div></div>
  <div class="foot">L x</div></div></div>`;
  const f=x=>String(x).padStart(2,'0');
  const tick=()=>{const ms=unlock-Date.now();
    if(ms<=0){clearInterval(timer);setTimeout(load,1500);return}
    d.textContent=Math.floor(ms/864e5);h.textContent=f(Math.floor(ms/36e5)%24);m.textContent=f(Math.floor(ms/6e4)%60);s.textContent=f(Math.floor(ms/1e3)%60)};
  tick();timer=setInterval(tick,1000);
}
function open(n){
  clearInterval(timer);app.innerHTML='';
  const scr=el('div','screen morning'),card=el('div','card');card.appendChild(el('div','sun'));
  const h1=el('h1',null,n.heading);if(n.sub)h1.appendChild(el('span',null,n.sub));card.appendChild(h1);
  const note=el('div','note');(n.body||[]).forEach(p=>note.appendChild(el('p',null,p)));note.appendChild(el('div','sig','L x'));
  card.appendChild(note);scr.appendChild(card);app.appendChild(scr);
}
const NOTE="eyJoZWFkaW5nIjogIk1vcm5pbmcgQ2xhaXJlLiIsICJzdWIiOiAiR29vZG5pZ2h0IFRheWxvci4iLCAiYm9keSI6IFsiQnkgdGhlIHRpbWUgeW91J3JlIHJlYWRpbmcgdGhpcyBJJ20gcHJvYmFibHkgb24gdGhlIGJpa2Ugb3IgaGFsZndheSB0aHJvdWdoIGEgY29mZmVlLCB0aGlua2luZyBhYm91dCB5b3UuIEkgYWx3YXlzIGFtLiIsICJJIGhvcGUgbGFzdCBuaWdodCB3YXMgYSBnb29kIG9uZSBhbmQgeW91J3JlIG5vdCB0b28gZG9uZSBvdmVyLiBUYWtlIHRvZGF5IGVhc3ksIHJlY292ZXIsIGFuZCBnZXQgcmVhZHkgdG8gZ28gaGFyZCB0b21vcnJvdy4gRHJpbmsgdGhlIFBvd2VyYWRlLiIsICJJIHdyb3RlIHRoaXMgYmVmb3JlIHlvdSBsZWZ0LCBhbHJlYWR5IGtub3dpbmcgSSdkIG1pc3MgeW91LiBJIGRvLiBJIGNhbid0IHdhaXQgdG8gc2VlIHlvdSBhZ2Fpbi4iLCAiT25lIHRoaW5nIEkgbG92ZSBhYm91dCB5b3U6IHlvdSdyZSBtYWduZXRpYy4gTm90IGxvdWQsIG5vdCBicmFzaC4gWW91IHB1bGwgdGhlIHdob2xlIHJvb20gaW4gd2l0aCB5b3VyIHN3ZWV0bmVzcyBhbmQgdGhlIHdheSB5b3UgZ28gYWJvdXQgbGlmZS4gSXQncyB3aHkgZXZlcnlvbmUncyBkcmF3biB0byB5b3UuIE5ldmVyIGxvc2UgdGhhdC4gSSdtIGNvbXBsZXRlbHkgZHJhd24gdG8gaXQuIiwgIkhhdmUgdGhlIGJlc3QgdGltZS4gTGV0IHlvdXIgaGFpciBkb3duLiJdfQ==";
function load(){
  if(Date.now()>=FALLBACK){open(JSON.parse(decodeURIComponent(escape(atob(NOTE)))));return}
  locked(FALLBACK);
}
load();
</script></body></html>
