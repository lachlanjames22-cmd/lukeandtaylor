<title>Sunday morning</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:#0b0714;color:#fff;-webkit-font-smoothing:antialiased}
.screen{min-height:100vh;min-height:100dvh;padding:48px 16px;display:flex;align-items:center;justify-content:center}
.night{background:radial-gradient(circle at 50% 30%,#2a0f4a 0%,#0b0714 70%)}
.box{text-align:center;max-width:420px}
.neon{font-family:Monoton,cursive;font-size:clamp(34px,11vw,56px);line-height:1.15;color:#ff4fd8;text-shadow:0 0 6px #ff4fd8,0 0 18px #ff4fd8,0 0 40px #b400ff;letter-spacing:2px;animation:flick 4s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.4}}
.night p{margin-top:18px;color:#d9c8ff;font-size:16px;line-height:1.5}
.count{margin-top:26px;display:flex;gap:10px;justify-content:center}
.count div{background:#ffffff10;border:1px solid #ff4fd855;border-radius:12px;padding:10px 0;width:64px}
.count b{display:block;font-size:24px;color:#7ff6ff;text-shadow:0 0 10px #00e5ff;font-variant-numeric:tabular-nums}
.count small{font-size:10px;letter-spacing:1px;opacity:.7;text-transform:uppercase}
.foot{margin-top:28px;font-size:12px;opacity:.5}
.morning{background:linear-gradient(180deg,#ffd9b8 0%,#ffeedd 35%,#e8f4f7 70%,#cfe8ee 100%);color:#2a2230}
.card{max-width:560px;width:100%;background:#fffaf4ee;border-radius:22px;padding:34px 24px;box-shadow:0 20px 60px rgba(120,70,40,.18);animation:rise 1.4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sun{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle,#ffcf6e,#ff9a5a);box-shadow:0 0 40px #ffb36b}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(26px,7vw,34px);text-align:center;line-height:1.2}
h1 span{display:block;font-style:italic;font-size:.62em;color:#b05a8a;margin-top:6px}
.note{margin-top:24px;font-size:17px;line-height:1.7}
.note p{margin-bottom:14px}
.sig{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;margin-top:8px}

function locked(unlock){
  clearInterval(timer);
  app.innerHTML=`<div class="screen night"><div class="box"><div class="neon">Not yet</div>
  <p>Unlocks after your night out.<br>Go have fun. I'll be here when the sun's up.</p>
  <div class="foot">L x</div></div></div>`;
  const tick=()=>{if(unlock-Date.now()<=0){clearInterval(timer);setTimeout(load,1500);}};
  tick();timer=setInterval(tick,1000);
}

  const note=el('div','note');(n.body||[]).forEach(p=>note.appendChild(el('p',null,p)));note.appendChild(el('div','sig','L x'));
