<title>Sunday morning</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:#0b0714;color:#fff;-webkit-font-smoothing:antialiased}
.screen{min-height:100vh;min-height:100dvh;padding:48px 16px;display:flex;align-items:center;justify-content:center}
.night{background:radial-gradient(circle at 50% 30%,#2a0f4a 0%,#0b0714 70%)}
.box{text-align:center;max-width:420px}
.neon{font-family:Monoton,cursive;font-size:clamp(34px,11vw,56px);line-height:1.15;color:#ff4fd8;text-shadow:0 0 6px #ff4fd8,0 0 18px #ff4fd8,0 0 40px #b400ff;letter-spacing:2px;animation:flick 4s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.4}}
.night p{margin-top:18px;color:#d9c8ff;font-size:16px;line-height:1.5}
.foot{margin-top:28px;font-size:12px;opacity:.5}
.morning{align-items:flex-start;color:#3a2e2a;background:#fdf3e6;background-image:radial-gradient(60vmax 60vmax at 85% -10%,rgba(255,200,97,.55),rgba(255,200,97,0) 60%),linear-gradient(180deg,#fff6dc,#ffe3c4 45%,#fdf3e6)}
.paper{position:relative;max-width:540px;width:100%;margin:10px auto 0;background:#fffdf6;border:1px solid #efe2c8;border-radius:6px;padding:34px 26px 30px;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
 background-image:repeating-linear-gradient(180deg,rgba(192,102,143,0) 0 31px,rgba(192,102,143,.07) 31px 32px);
 box-shadow:0 1px 0 #fff inset,0 18px 40px rgba(150,100,60,.18),0 3px 8px rgba(150,100,60,.12);transform:rotate(-.5deg);animation:rise 1.4s ease-out}
.paper::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,214,140,.75);box-shadow:0 2px 5px rgba(150,100,60,.15)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:rotate(-.5deg)}}
h1{font-weight:600;font-size:clamp(30px,8.5vw,38px);line-height:1.1}
h1 span{display:block;font-style:italic;font-weight:500;font-size:.62em;color:#c0668f;margin-top:6px}
.note{margin-top:20px;font-size:21px;line-height:1.6;font-weight:500}
.note p{margin-bottom:15px;text-wrap:pretty}
.note::after{content:"";display:block;clear:both}
.snap{margin:6px auto 18px;width:min(78%,300px);background:#fff;padding:9px 9px 26px;border-radius:3px;box-shadow:0 10px 24px rgba(150,100,60,.22),0 2px 5px rgba(150,100,60,.14);transform:rotate(-2deg)}
.snap img{display:block;width:100%;height:auto;border-radius:2px}
.snap.small{float:right;width:min(40%,150px);margin:4px 0 10px 16px;padding:6px 6px 18px;transform:rotate(3deg)}
.snap.tilt{transform:rotate(1.8deg)}
.sig{font-family:Caveat,"Bradley Hand",cursive;font-weight:600;font-size:44px;line-height:1;color:#c0668f;margin-top:6px;clear:both}
.ps{font-size:20px;font-style:italic;margin:16px 0 12px}
.pair{display:flex;gap:12px;justify-content:center}.pair .snap{margin:0;width:48%;padding:7px 7px 20px}
@media (max-width:420px){.paper{padding:30px 20px 26px}.note{font-size:20px}}
@media (prefers-reduced-motion:reduce){.paper,.snap{transform:none!important;animation:none}}
</style></head><body><div id="app"></div>

const SLUG="sunday",LABEL="Sunday morning",FALLBACK=1795892400000;
const app=document.getElementById('app');let timer;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function locked(unlock){
  clearInterval(timer);
  app.innerHTML=`<div class="screen night"><div class="box"><div class="neon">Not yet</div>
  <p>Unlocks after your night out.<br>Go have fun. Come back in the morning.</p>
  <div class="foot">L x</div></div></div>`;
  const tick=()=>{if(unlock-Date.now()<=0){clearInterval(timer);setTimeout(load,1500);}};
  tick();timer=setInterval(tick,1000);
}
function snap(src,c){const f=el('figure','snap'+(c?' '+c:'')),i=el('img');i.src=src;i.alt='';f.appendChild(i);return f}
function open(n){
  clearInterval(timer);app.innerHTML='';
  const scr=el('div','screen morning'),card=el('div','paper');
  const h1=el('h1',null,n.heading);if(n.sub)h1.appendChild(el('span',null,n.sub));card.appendChild(h1);
  const note=el('div','note');
  (n.items||[]).forEach(it=>{
    if(it.t==='p')note.appendChild(el('p',null,it.x));
    else if(it.t==='img')note.appendChild(snap(it.src,it.c));
    else if(it.t==='sig')note.appendChild(el('div','sig',it.x||'L x'));
    else if(it.t==='ps')note.appendChild(el('p','ps',it.x));
    else if(it.t==='pair'){const d=el('div','pair');it.srcs.forEach((s,i)=>d.appendChild(snap(s,i?'tilt':'')));note.appendChild(d)}
  });
  card.appendChild(note);scr.appendChild(card);app.appendChild(scr);
}
